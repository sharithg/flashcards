name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Not secret: identify the Vercel project. VERCEL_TOKEN is a repo secret.
  VERCEL_ORG_ID: team_tNoNoRvUffkjVWf0zYs1afUz
  VERCEL_PROJECT_ID: prj_Z1KWbWNVxTf8tYxdfEcCTuGDopfh

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  deploy:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never run two migrate+deploy sequences at once; queue them instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@latest

      - name: Pull Vercel production settings and env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Runs after a successful build and before the new code goes live, so
      # migrations must stay compatible with the currently deployed code.
      - name: Migrate database
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          npm run db:migrate

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
