name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Not secret: identify the Vercel project. VERCEL_TOKEN is a repo secret.
  VERCEL_ORG_ID: team_tNoNoRvUffkjVWf0zYs1afUz
  VERCEL_PROJECT_ID: prj_Z1KWbWNVxTf8tYxdfEcCTuGDopfh

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  deploy:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never run two migrate+deploy sequences at once; queue them instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL: pnpm dlx vercel@latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pull Vercel production settings and env vars
        run: $VERCEL pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: $VERCEL build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Runs after a successful build and before the new code goes live, so
      # migrations must stay compatible with the currently deployed code.
      - name: Migrate database
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          pnpm db:migrate

      - name: Deploy
        run: $VERCEL deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
